[package]
name = "ghvirtualgamepad"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Per-device USB keyboard to virtual gamepad mapper with digital whammy smoothing"
repository = "https://github.com/BrainAlaw/GHVirtualGamePad"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
