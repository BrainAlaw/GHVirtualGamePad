name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  QT_QUICK_BACKEND: software
  QT_QPA_PLATFORM: offscreen
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python tools/build_windows.py
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer without changing system drivers
        shell: pwsh
        run: |
          $trial = Join-Path $env:RUNNER_TEMP 'ghvp-install-test'
          $installer = (Resolve-Path 'artifacts/GHVirtualGamePad-0.2.0-windows-x64-setup.exe').Path
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=""', "/DIR=`"$trial`"")
          $result = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $result = Start-Process -FilePath "$trial\GHVirtualGamePad.exe" -ArgumentList '--demo --smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw 'Installed GUI smoke test failed' }
          $result = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw 'Upgrade failed' }
          $result = Start-Process -FilePath "$trial\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/GHVirtualGamePad-0.2.0-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30
