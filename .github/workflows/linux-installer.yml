name: Build Linux installer
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  QT_QUICK_BACKEND: software
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python tools/build_frozen.py
      - name: Test installation and upgrade
        shell: bash
        run: |
          set -euo pipefail
          trial_dir=$(mktemp -d)
          tar -xzf artifacts/ghvirtualgamepad-0.2.0-rc.2-linux-x86_64.tar.gz -C "$trial_dir"
          export XDG_DATA_HOME="$trial_dir/user-data"
          export XDG_CONFIG_HOME="$trial_dir/user-config"
          bash "$trial_dir/ghvirtualgamepad/install.sh" --dry-run
          bash "$trial_dir/ghvirtualgamepad/install.sh"
          previous=$(readlink "$XDG_DATA_HOME/ghvirtualgamepad/current")
          bash "$trial_dir/ghvirtualgamepad/install.sh"
          test -d "$previous"
          test "$previous" != "$(readlink "$XDG_DATA_HOME/ghvirtualgamepad/current")"
          QT_QPA_PLATFORM=offscreen "$XDG_DATA_HOME/ghvirtualgamepad/current/app/GHVirtualGamePad" --demo --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: artifacts/ghvirtualgamepad-0.2.0-rc.2-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
